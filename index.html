<title>Tablero semanal</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3f1ec;--surface:#fff;--text:#1f1f1c;--muted:#6b6b64;--line:#d9d6cc;--accent:#2b4a6f;
--c-y:#fbe36a;--c-g:#b9e07a;--c-p:#f5a7b8;--c-o:#f7b267;--note-text:#2a2a20}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#16171a;--surface:#202226;--text:#ecebe6;--muted:#a1a198;--line:#3a3d42;--accent:#8fb4e3;--note-text:#2a2a20}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#16171a;--surface:#202226;--text:#ecebe6;--muted:#a1a198;--line:#3a3d42;--accent:#8fb4e3}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:14px 14px 6px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
h1{font-size:18px;margin:0}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 10px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:8px;padding:7px 12px}
button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.week{margin:0 10px 18px;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow-x:auto}
.wt{padding:8px 12px;font-weight:600;border-bottom:1px solid var(--line);position:sticky;left:0}
.grid{display:grid;grid-template-columns:repeat(6,minmax(120px,1fr));min-width:720px}
.col{border-right:1px solid var(--line);min-height:240px;display:flex;flex-direction:column}
.col:last-child{border-right:0;background:repeating-linear-gradient(135deg,transparent 0 8px,rgba(128,128,128,.07) 8px 16px)}
.col.over{outline:2px dashed var(--accent);outline-offset:-3px}
.dh{padding:6px 8px;text-align:center;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.dh b{display:block;color:var(--text);font-size:18px}
.notes{flex:1;padding:6px;display:flex;flex-direction:column;gap:6px}
.note{background:var(--c-y);color:var(--note-text);padding:7px 8px;border-radius:3px;font-size:12px;font-weight:600;text-transform:uppercase;line-height:1.25;box-shadow:0 1px 3px rgba(0,0,0,.25);cursor:pointer;word-break:break-word}
.note.ok{box-shadow:0 0 0 3px #2e9e4f,0 1px 3px rgba(0,0,0,.25)}.note.no{box-shadow:0 0 0 3px #d63a2f,0 1px 3px rgba(0,0,0,.25)}
.st{float:right;margin:-3px -3px 0 4px;width:26px;height:26px;padding:0;border-radius:50%;border:1.5px solid rgba(0,0,0,.35);background:rgba(255,255,255,.65);color:#555;font-size:15px;line-height:1;font-weight:700}
.note.ok .st{background:#2e9e4f;color:#fff;border-color:#2e9e4f}.note.no .st{background:#d63a2f;color:#fff;border-color:#d63a2f}
.sw2{display:flex;gap:6px}.sw2 button{flex:1;padding:7px 4px;font-size:13px}
.add{margin:0 6px 6px;border-style:dashed;color:var(--muted);padding:5px}
.mn{display:flex;align-items:center;gap:8px;padding:0 14px 10px;flex-wrap:wrap}.mn strong{font-size:17px;min-width:150px;text-align:center}input[type=month]{font:inherit;padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text)}
.dh.out{opacity:.55}.dh.today b{color:var(--accent);text-decoration:underline}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.ov.show{display:flex}
.modal{background:var(--surface);border-radius:12px;padding:16px;width:100%;max-width:380px;display:grid;gap:10px}
textarea,select{width:100%;font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text)}
textarea{min-height:80px;resize:vertical}
.sw{display:flex;gap:8px}
.sw span{width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.sw span.sel{border-color:var(--text)}
.row{display:flex;gap:8px;justify-content:space-between}
.del{color:#c0392b}
.hint{padding:0 14px 8px;font-size:12px;color:var(--muted)}
@media print{.mn button,.mn input,header button,.tabs,.add,.hint{display:none}.week{break-inside:avoid;overflow:visible}}
</style>
</head>
<body>
<header><h1>Planificación semanal</h1><div><button id="pr">Imprimir / PDF</button> <button id="rs">Restablecer</button></div></header>
<nav class="mn"><button id="pm" aria-label="Mes anterior">‹</button><strong id="ttl"></strong><button id="nm" aria-label="Mes siguiente">›</button><input type="month" id="mp"><button id="td">Hoy</button></nav>
<div class="tabs" id="tabs"></div>
<div class="hint">Tocá una nota para editarla, moverla de día o borrarla. En computadora también podés arrastrarla.</div>
<main id="main"></main>

<div class="ov" id="ov"><div class="modal">
<textarea id="tx" placeholder="Tarea (ej.: Gas piso 7)"></textarea>
<div class="sw" id="sw"></div>
<select id="dy"></select>
<div class="sw2" id="ss"></div>
<div class="row"><button class="del" id="bd">Borrar</button><span><button id="bc">Cancelar</button> <button class="on" id="bs">Guardar</button></span></div>
</div></div>

<script>
var COLORS={y:'var(--c-y)',g:'var(--c-g)',p:'var(--c-p)',o:'var(--c-o)'};
var DN=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
var MN=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
var KEY='tablero-nov-2026';
function pad(n){return n<10?'0'+n:''+n}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function ds(d){return '2026-11-'+pad(d)}
function seed(){var n=[],i=0;function a(d,t,c){n.push({id:'s'+(i++),date:ds(d),text:t,color:c})}
a(2,'Gas piso 7','o');a(2,'Radiadores piso 10','y');a(2,'Tubo cloacal pisos 7, 8','g');a(2,'Armado yeso piso 4','p');a(2,'Yeso casas','p');a(2,'Pintura intumescente','p');a(2,'Revoque terraza','p');
a(4,'Imprimación terraza casas','g');a(6,'Gas piso 8','o');
a(9,'Cañerías AA pisos 8, 9','y');a(9,'Armado yeso piso 5','p');a(10,'Cañerías eléctricas pisos 2, 3, 4','y');a(10,'Contrapiso refrigerio pisos 4, 5','g');
a(11,'Agua sanitaria piso 9','g');a(12,'Escalera terraza','y');a(13,'Yeso casas','p');a(13,'Contrapiso refrigerio piso 6','y');
a(16,'Armado yeso piso 6','p');a(16,'Yeso piso 2','p');a(18,'Agua sanitaria piso 8','g');a(23,'Armado yeso piso 7','p');
return n}
var notes,week='all',cur=null,now=new Date(),vy=now.getFullYear(),vm=now.getMonth();
function load(){try{var s=localStorage.getItem(KEY);if(s)return JSON.parse(s)}catch(e){}return seed()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(notes))}catch(e){}}
notes=load();
function $(i){return document.getElementById(i)}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function weeks(){var first=new Date(vy,vm,1),last=new Date(vy,vm+1,0);
var s=new Date(vy,vm,1-((first.getDay()+6)%7)),out=[];
while(s<=last){var days=[];for(var i=0;i<6;i++)days.push(new Date(s.getFullYear(),s.getMonth(),s.getDate()+i));
if(days.some(function(d){return d.getMonth()===vm}))out.push(days);
s=new Date(s.getFullYear(),s.getMonth(),s.getDate()+7)}return out}
function mon(d){return MN[d.getMonth()].toLowerCase()}
function range(days){var a=days[0],b=days[5];
if(a.getMonth()===b.getMonth())return a.getDate()+' al '+b.getDate()+' de '+mon(a);
return a.getDate()+' '+mon(a).slice(0,3)+' al '+b.getDate()+' '+mon(b).slice(0,3)}
function renderTabs(n){var t=$('tabs');t.innerHTML='';var l=['all'];for(var i=0;i<n;i++)l.push(i);
l.forEach(function(w){var b=el('button',week===w?'on':'',w==='all'?'Todas':'Semana '+(w+1));b.onclick=function(){week=w;render()};t.appendChild(b)})}
function render(){var W=weeks();if(week!=='all'&&week>=W.length)week='all';
$('ttl').textContent=MN[vm]+' '+vy;$('mp').value=vy+'-'+pad(vm+1);renderTabs(W.length);
var m=$('main');m.innerHTML='';var today=iso(new Date());
W.forEach(function(days,wi){if(week!=='all'&&week!==wi)return;
var w=el('section','week');w.appendChild(el('div','wt','Semana '+(wi+1)+' · '+range(days)));
var g=el('div','grid');
days.forEach(function(dt,di){var date=iso(dt),c=el('div','col');
var h=el('div','dh'+(date===today?' today':'')+(dt.getMonth()!==vm?' out':''),DN[di]);
var b=el('b','',String(dt.getDate()));h.appendChild(b);
if(dt.getMonth()!==vm)h.appendChild(document.createTextNode(mon(dt).slice(0,3)));
c.appendChild(h);
var nb=el('div','notes');
notes.filter(function(n){return n.date===date}).forEach(function(n){
var e=el('div','note'+(n.status?' '+n.status:''));var st=el('button','st',n.status==='ok'?'\u2713':n.status==='no'?'\u2717':'\u25cb');st.title='Cumplida / No cumplida / Pendiente';st.onclick=function(ev){ev.stopPropagation();n.status=!n.status?'ok':n.status==='ok'?'no':null;save();render()};e.appendChild(st);e.appendChild(document.createTextNode(n.text));
e.style.background=COLORS[n.color]||COLORS.y;e.draggable=true;
e.ondragstart=function(ev){ev.dataTransfer.setData('text/plain',n.id)};
e.onclick=function(){openM(n)};nb.appendChild(e)});
c.appendChild(nb);
var ab=el('button','add','+ Agregar');ab.onclick=function(){openM({id:null,date:date,text:'',color:'y'})};c.appendChild(ab);
c.ondragover=function(ev){ev.preventDefault();c.classList.add('over')};
c.ondragleave=function(){c.classList.remove('over')};
c.ondrop=function(ev){ev.preventDefault();c.classList.remove('over');var id=ev.dataTransfer.getData('text/plain');notes.forEach(function(n){if(n.id===id)n.date=date});save();render()};
g.appendChild(c)});
w.appendChild(g);m.appendChild(w)})}
function go(dm){vm+=dm;if(vm<0){vm=11;vy--}if(vm>11){vm=0;vy++}week='all';render()}
$('pm').onclick=function(){go(-1)};
$('nm').onclick=function(){go(1)};
$('td').onclick=function(){var t=new Date();vy=t.getFullYear();vm=t.getMonth();week='all';render()};
$('mp').onchange=function(){var p=this.value.split('-');if(p.length===2){vy=+p[0];vm=+p[1]-1;week='all';render()}};
function buildM(){var sw=$('sw');Object.keys(COLORS).forEach(function(k){var p=el('span');p.style.background=COLORS[k];p.dataset.k=k;p.onclick=function(){cur.color=k;mark()};sw.appendChild(p)});
var ss=$('ss');[['ok','\u2713 Cumplida'],['no','\u2717 No cumplida'],['','\u25cb Pendiente']].forEach(function(a){var b=el('button','',a[1]);b.dataset.s=a[0];b.onclick=function(){cur.status=a[0]||null;markS()};ss.appendChild(b)})}
function buildSel(date){var dy=$('dy');dy.innerHTML='';var has=false;
weeks().forEach(function(days){days.forEach(function(d,i){var o=el('option','',DN[i]+' '+d.getDate()+' de '+mon(d));o.value=iso(d);if(o.value===date)has=true;dy.appendChild(o)})});
if(!has){var o=el('option','',date);o.value=date;dy.appendChild(o)}dy.value=date}
function markS(){document.querySelectorAll('#ss button').forEach(function(b){b.classList.toggle('on',b.dataset.s===(cur.status||''))})}
function mark(){document.querySelectorAll('#sw span').forEach(function(p){p.classList.toggle('sel',p.dataset.k===cur.color)})}
function openM(n){cur={id:n.id,date:n.date,text:n.text,color:n.color,status:n.status||null};$('tx').value=n.text;buildSel(n.date);$('bd').style.display=n.id?'':'none';mark();markS();$('ov').classList.add('show');$('tx').focus()}
function closeM(){$('ov').classList.remove('show')}
$('bc').onclick=closeM;
$('bs').onclick=function(){var t=$('tx').value.trim();if(!t){closeM();return}
cur.text=t;cur.date=$('dy').value;
if(cur.id){notes.forEach(function(n){if(n.id===cur.id){n.text=cur.text;n.date=cur.date;n.color=cur.color;n.status=cur.status}})}
else{notes.push({id:'n'+Date.now(),date:cur.date,text:cur.text,color:cur.color,status:cur.status})}
save();closeM();render()};
$('bd').onclick=function(){notes=notes.filter(function(n){return n.id!==cur.id});save();closeM();render()};
$('ov').onclick=function(e){if(e.target===$('ov'))closeM()};
$('pr').onclick=function(){window.print()};
$('rs').onclick=function(){if(confirm('¿Borrar todos los cambios y volver a las tareas iniciales de la foto (noviembre 2026)?')){notes=seed();save();render()}};
buildM();render();
</script>
